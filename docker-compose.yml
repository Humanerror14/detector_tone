services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - YOUTUBE_LYRICS_LANGS=${YOUTUBE_LYRICS_LANGS:-id,en}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-10485760}
      - ENABLE_DEBUG_ENDPOINTS=${ENABLE_DEBUG_ENDPOINTS:-false}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-30}
      - YTDLP_DENO_PATH=${YTDLP_DENO_PATH:-}

  frontend:
    build:
      context: .
    ports:
      - "5173:5173"
    environment:
      - VITE_ANALYSIS_API_URL=http://localhost:8000
      - VITE_YOUTUBE_API_KEY=${VITE_YOUTUBE_API_KEY:-}
    depends_on:
      - backend
